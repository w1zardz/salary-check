<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALARY.EXE — Калькулятор уровня жизни</title>
<meta name="description" content="Узнай реальный уровень жизни по зарплате в разных городах мира. Москва, Воронеж, Лиски, Дубай, Таиланд и другие.">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0e14;
  --panel:#0d1117;
  --border:#1e2a3a;
  --green:#00ff41;
  --green-dim:#0a6e23;
  --orange:#ff9500;
  --red:#ff3b30;
  --yellow:#ffd60a;
  --blue:#0a84ff;
  --cyan:#64d2ff;
  --text:#c9d1d9;
  --muted:#6e7681;
  --white:#f0f6fc;
}

body{
  font-family:'JetBrains Mono',monospace;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  max-width:800px;
  margin:0 auto;
  padding:12px;
}

/* Terminal window */
.terminal{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 0 60px rgba(0,255,65,0.05);
}

.terminal-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  background:#161b22;
  border-bottom:1px solid var(--border);
}

.dots{display:flex;gap:8px}
.dots span{width:12px;height:12px;border-radius:50%}
.dots span:nth-child(1){background:#ff5f57}
.dots span:nth-child(2){background:#febc2e}
.dots span:nth-child(3){background:#28c840}

.terminal-title{
  font-size:12px;
  color:var(--muted);
}

.terminal-body{
  padding:20px 16px;
}

/* Logo */
.logo{
  color:var(--green);
  font-size:clamp(28px,8vw,56px);
  font-weight:700;
  letter-spacing:4px;
  text-shadow:0 0 20px rgba(0,255,65,0.3);
  margin-bottom:4px;
  line-height:1.1;
}

.version{
  color:var(--muted);
  font-size:11px;
  margin-bottom:20px;
}

.divider{
  border:none;
  border-top:1px solid var(--border);
  margin:20px 0;
}

/* Command prompt */
.cmd{
  color:var(--green);
  font-size:clamp(13px,3.5vw,16px);
  margin-bottom:12px;
}
.cmd::before{content:'❯ ';color:var(--muted)}

/* City selector */
.cities{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:8px;
}

.city-group-label{
  width:100%;
  font-size:11px;
  color:var(--muted);
  margin-top:8px;
  margin-bottom:2px;
}
.city-group-label:first-child{margin-top:0}

.city-btn{
  font-family:inherit;
  font-size:clamp(12px,3vw,14px);
  padding:6px 14px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
  border-radius:4px;
  transition:all .15s;
  white-space:nowrap;
}

.city-btn:hover{
  border-color:var(--green);
  color:var(--green);
}

.city-btn.active{
  background:var(--green);
  color:var(--bg);
  border-color:var(--green);
  font-weight:700;
}

/* Tiers */
.tiers-header{
  color:var(--muted);
  font-size:12px;
  margin-bottom:4px;
  line-height:1.6;
}

.tier{
  border-left:3px solid;
  padding:12px 16px;
  margin:10px 0;
  background:rgba(255,255,255,0.02);
  border-radius:0 6px 6px 0;
  transition:all .2s;
}

.tier:hover{
  background:rgba(255,255,255,0.04);
}

.tier-range{
  font-weight:700;
  font-size:clamp(13px,3.5vw,15px);
  margin-bottom:4px;
}

.tier-desc{
  font-size:clamp(12px,3vw,13px);
  color:var(--muted);
  line-height:1.5;
}

.tier-1{border-color:var(--red)}
.tier-1 .tier-range{color:var(--red)}

.tier-2{border-color:var(--orange)}
.tier-2 .tier-range{color:var(--orange)}

.tier-3{border-color:var(--yellow)}
.tier-3 .tier-range{color:var(--yellow)}

.tier-4{border-color:var(--green)}
.tier-4 .tier-range{color:var(--green)}

.tier-5{border-color:var(--cyan)}
.tier-5 .tier-range{color:var(--cyan)}

/* Checker */
.checker{margin-top:8px}

.input-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.input-label{
  color:var(--green);
  font-size:clamp(13px,3.5vw,15px);
  white-space:nowrap;
}

.salary-input{
  font-family:inherit;
  font-size:clamp(16px,4vw,18px);
  background:transparent;
  border:none;
  border-bottom:2px solid var(--green-dim);
  color:var(--green);
  padding:4px 0;
  width:180px;
  max-width:100%;
  outline:none;
  transition:border-color .2s;
}

.salary-input:focus{
  border-bottom-color:var(--green);
}

.salary-input::placeholder{
  color:var(--green-dim);
}

.result{
  font-size:clamp(13px,3.5vw,15px);
  padding:12px 16px;
  background:rgba(255,255,255,0.02);
  border-radius:6px;
  border-left:3px solid var(--muted);
  min-height:44px;
  transition:all .3s;
  line-height:1.5;
}

.result.has-result{
  animation:fadeIn .3s;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}

.result-emoji{margin-right:6px}

/* Footer */
.footer{
  text-align:center;
  padding:16px;
  font-size:11px;
  color:var(--muted);
}

.cursor{
  display:inline-block;
  width:8px;
  height:16px;
  background:var(--green);
  animation:blink 1s step-end infinite;
  vertical-align:text-bottom;
  margin-left:2px;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:480px){
  .container{padding:8px}
  .terminal-body{padding:14px 12px}
  .city-btn{padding:5px 10px;font-size:12px}
  .tier{padding:10px 12px;margin:8px 0}
}
</style>
</head>

  <div class="result" id="result"></div>
</div>

<div class="footer">

</div>

</div>
</div>

let currentCity = 'msk';

function formatNumber(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function renderTiers(cityKey) {
  const city = DATA[cityKey];
  const container = document.getElementById('tiers-container');
  document.getElementById('config-file', cityKey);
  document.getElementById('config-file').textContent = cityKey;
  document.getElementById('city-name').textContent = city.name;
  document.getElementById('currency-label').textContent = city.currency;
  document.getElementById('currency-input').textContent = city.currency;

  container.innerHTML = city.tiers.map(t => `
    <div class="tier tier-${t.color}">
      <div class="tier-range">${t.label}</div>
      <div class="tier-desc">${t.desc}</div>
    </div>
  `).join('');
}

function checkSalary(val, cityKey) {
  const city = DATA[cityKey];
  const result = document.getElementById('result');

  if (!val || val <= 0) {
    result.innerHTML = '';
    result.className = 'result';
    result.style.borderLeftColor = 'var(--muted)';
    return;
  }

  const tier = city.tiers.find(t => val < t.max) || city.tiers[city.tiers.length - 1];
  const colors = ['','var(--red)','var(--orange)','var(--yellow)','var(--green)','var(--cyan)'];

  result.innerHTML = `<span class="result-emoji">${tier.emoji}</span> ${formatNumber(val)} ${city.symbol}/мес — ${tier.desc.split('.')[0].toLowerCase()}`;
  result.className = 'result has-result';
  result.style.borderLeftColor = colors[tier.color];
}

// City buttons
document.querySelectorAll('.city-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCity = btn.dataset.city;
    renderTiers(currentCity);
    const input = document.getElementById('salary-input');
    input.value = '';
    document.getElementById('result').innerHTML = '';
    document.getElementById('result').style.borderLeftColor = 'var(--muted)';
    input.placeholder = '0';
  });
});

// Salary input
const salaryInput = document.getElementById('salary-input');
salaryInput.addEventListener('input', () => {
  let raw = salaryInput.value.replace(/[^\d]/g, '');
  if (raw) {
    salaryInput.value = formatNumber(parseInt(raw));
    checkSalary(parseInt(raw), currentCity);
  } else {
    salaryInput.value = '';
    checkSalary(0, currentCity);
  }
});

// Init
renderTiers('msk');
</script>
