<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KripMine Glyph Tools</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent2:#1f6feb;
  --green:#3fb950;--red:#f85149;--orange:#d29922;
  --cell-size:min(5.8vw, 56px);--grid-gap:2px;--radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
.container{max-width:960px;margin:0 auto;padding:12px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.header h1{font-size:1.3rem;font-weight:700}
.header h1 span{color:var(--green)}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h2{font-size:.9rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;font-weight:600}

/* Inputs */
.input-row{display:flex;gap:8px;margin-bottom:12px}
.hex-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:monospace;font-size:1.1rem;font-weight:700;text-transform:uppercase;outline:none;transition:border .2s}
.hex-input:focus{border-color:var(--accent)}
.hex-input::placeholder{color:var(--text2);font-weight:400;text-transform:none}
.btn{background:var(--accent2);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.95);opacity:.8}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:active{background:var(--bg3)}
.btn-sm{padding:6px 12px;font-size:.78rem;border-radius:6px}

/* Upload zone */
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;color:var(--text2);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.upload-zone:active{border-color:var(--accent);background:rgba(88,166,255,.05)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-zone .icon{font-size:2rem;margin-bottom:8px}
.upload-zone p{font-size:.85rem}
.upload-status{font-size:.78rem;color:var(--green);margin-top:6px;display:none}

/* Grid */
.grid-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--border)}
.grid-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.grid-header h2{margin:0}
.atlas-info{font-size:.75rem;color:var(--text2)}
.glyph-grid{display:grid;grid-template-columns:repeat(16,var(--cell-size));gap:var(--grid-gap);padding:8px;justify-content:center}
.glyph-grid div{
  width:var(--cell-size);height:var(--cell-size);
  background-size:100% 100%;background-repeat:no-repeat;
  border-radius:4px;cursor:pointer;transition:transform .1s,box-shadow .1s;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell-size) * .55);line-height:1;
  position:relative;background-color:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.04);
  image-rendering:pixelated;
}
.glyph-grid div:active{transform:scale(1.15);z-index:2;box-shadow:0 0 0 2px var(--accent)}
.glyph-grid div.transparent{opacity:.3}
.glyph-grid div.has-img{font-size:0;color:transparent}

/* Row/col labels */
.grid-labels{display:grid;grid-template-columns:repeat(16,var(--cell-size));gap:var(--grid-gap);padding:0 8px;justify-content:center;margin-bottom:2px}
.grid-labels span{width:var(--cell-size);text-align:center;font-size:.6rem;color:var(--text2);font-family:monospace}

/* Detail panel (bottom sheet on mobile) */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay.active{display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.overlay.active{align-items:center}}
.detail-sheet{background:var(--bg2);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85dvh;overflow-y:auto;padding:20px;animation:slideUp .25s ease}
@media(min-width:600px){.detail-sheet{border-radius:16px;margin:20px}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.detail-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.detail-preview{display:flex;justify-content:center;margin-bottom:16px}
.detail-preview img{image-rendering:pixelated;width:128px;height:128px;border-radius:8px;background:repeating-conic-gradient(var(--bg3) 0% 25%,var(--bg) 0% 50%) 0 0/16px 16px}
.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-field{background:var(--bg3);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.detail-field:active{border-color:var(--accent);background:rgba(88,166,255,.08)}
.detail-field .label{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.detail-field .value{font-family:monospace;font-weight:700;font-size:.9rem;word-break:break-all}
.detail-field.wide{grid-column:1/-1}
.detail-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.copied-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--green);color:#000;padding:8px 20px;border-radius:20px;font-weight:700;font-size:.85rem;z-index:200;pointer-events:none;opacity:0;transition:opacity .2s}
.copied-toast.show{opacity:1}

/* Converter */
.converter-row{display:flex;gap:8px;align-items:stretch}
.converter-row .hex-input{flex:1}
.converter-output{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--green);font-family:monospace;font-size:1.1rem;font-weight:700;outline:none;cursor:pointer}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Quick actions */
.quick-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><span>Krip</span>Mine Glyph Tools</h1>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm btn-outline" id="btnExport" title="Скачать атлас">PNG ↓</button>
    </div>
  </div>

  <!-- Hex input + upload -->
  <div class="card">
    <h2>Загрузить глиф-лист</h2>
    <div class="input-row">
      <input type="text" id="hexInput" class="hex-input" placeholder="E0, E1, E6..." maxlength="4" value="E1">
      <button class="btn" id="btnGenerate">Показать</button>
    </div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" accept=".png" id="fileInput">
      <div class="icon">📁</div>
      <p>Загрузить glyph_XX.png</p>
      <div class="upload-status" id="uploadStatus"></div>
    </div>
    <div class="quick-actions">
      <button class="btn btn-sm btn-outline" data-hex="E0">E0</button>
      <button class="btn btn-sm btn-outline" data-hex="E1">E1 Иконки</button>
      <button class="btn btn-sm btn-outline" data-hex="E2">E2 UI</button>
      <button class="btn btn-sm btn-outline" data-hex="E4">E4 NPC</button>
      <button class="btn btn-sm btn-outline" data-hex="E5">E5</button>
      <button class="btn btn-sm btn-outline" data-hex="E6">E6 Ранги</button>
      <button class="btn btn-sm btn-outline" data-hex="E7">E7 Анархия</button>
      <button class="btn btn-sm btn-outline" data-hex="E8">E8 Лого</button>
      <button class="btn btn-sm btn-outline" data-hex="B7">B7 Буквы</button>
    </div>
  </div>

  <!-- Converter -->
  <div class="card">
    <h2>Конвертер hex ↔ символ</h2>
    <div class="converter-row">
      <input type="text" id="convInput" class="hex-input" placeholder="0xE100 или символ...">
      <input type="text" id="convOutput" class="converter-output" readonly placeholder="Результат">
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-wrap">
    <div class="grid-header">
      <div>
        <h2 style="display:inline">Сетка</h2>
        <span class="atlas-info" id="atlasInfo">нет данных</span>
      </div>
    </div>
    <div class="grid-labels" id="colLabels"></div>
    <div class="glyph-grid" id="glyphGrid"></div>
  </div>
</div>

<!-- Detail overlay -->
<div class="overlay" id="overlay">
  <div class="detail-sheet" id="detailSheet">
    <div class="detail-handle"></div>
    <div class="detail-preview">
      <img id="detailImg" src="" alt="preview">
    </div>
    <div class="detail-meta">
      <div class="detail-field" data-copy="hex"><div class="label">HEX</div><div class="value" id="dHex">-</div></div>
      <div class="detail-field" data-copy="dec"><div class="label">Decimal</div><div class="value" id="dDec">-</div></div>
      <div class="detail-field" data-copy="char"><div class="label">Символ</div><div class="value" id="dChar">-</div></div>
      <div class="detail-field" data-copy="pos"><div class="label">Позиция</div><div class="value" id="dPos">-</div></div>
      <div class="detail-field" data-copy="unicode"><div class="label">PHP код</div><div class="value" id="dPHP">-</div></div>
      <div class="detail-field" data-copy="size"><div class="label">Размер</div><div class="value" id="dSize">-</div></div>
      <div class="detail-field wide" data-copy="phpstr"><div class="label">Строка для PHP</div><div class="value" id="dPHPStr">-</div></div>
    </div>
    <div class="detail-actions">
      <button class="btn" id="btnCopyChar">Копировать символ</button>
      <button class="btn btn-outline" id="btnCopyPHP">Копировать PHP</button>
      <button class="btn btn-outline" id="btnDlCell">Скачать PNG</button>
      <button class="btn btn-outline" onclick="document.getElementById('overlay').classList.remove('active')">Закрыть</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="copied-toast" id="toast">Скопировано!</div>

<script>
const GRID = 16;
let atlasDataUrl = null;
let currentHex = 'E1';

// Column labels
const colLabels = document.getElementById('colLabels');
for (let c = 0; c < 16; c++) {
  const s = document.createElement('span');
  s.textContent = c.toString(16).toUpperCase();
  colLabels.appendChild(s);
}

// Toast
function toast(msg = 'Скопировано!') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

// Generate grid from hex (no image)
function generateGrid(hex) {
  hex = hex.toUpperCase().replace(/[^0-9A-F]/g, '');
  if (!hex) hex = 'E0';
  currentHex = hex;

  const grid = document.getElementById('glyphGrid');
  const startChar = parseInt(hex + '00', 16);
  let html = '';

  for (let i = 0; i < 256; i++) {
    const code = startChar + i;
    const ch = String.fromCodePoint(code);
    const hexCode = code.toString(16).toUpperCase().padStart(4, '0');
    const row = Math.floor(i / 16);
    const col = i % 16;
    html += `<div data-hex="0x${hexCode}" data-char="${ch}" data-row="${row}" data-col="${col}" title="U+${hexCode}">${ch}</div>`;
  }

  grid.innerHTML = html;
  atlasDataUrl = null;
  document.getElementById('atlasInfo').textContent = `glyph_${hex}.png — без изображения`;
}

// Process uploaded image
function processImage(img, hex) {
  hex = hex.toUpperCase();
  currentHex = hex;

  const cellSize = Math.floor(Math.min(img.width, img.height) / 16);
  const canvas = document.createElement('canvas');
  canvas.width = cellSize * 16;
  canvas.height = cellSize * 16;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  atlasDataUrl = canvas.toDataURL('image/png');

  const grid = document.getElementById('glyphGrid');
  const startChar = parseInt(hex + '00', 16);
  let html = '';

  for (let i = 0; i < 256; i++) {
    const code = startChar + i;
    const ch = String.fromCodePoint(code);
    const hexCode = code.toString(16).toUpperCase().padStart(4, '0');
    const row = Math.floor(i / 16);
    const col = i % 16;

    const x = col * cellSize;
    const y = row * cellSize;
    const cellCanvas = document.createElement('canvas');
    cellCanvas.width = cellSize;
    cellCanvas.height = cellSize;
    const cellCtx = cellCanvas.getContext('2d');
    cellCtx.imageSmoothingEnabled = false;
    cellCtx.drawImage(canvas, x, y, cellSize, cellSize, 0, 0, cellSize, cellSize);

    // Check if transparent
    const imgData = cellCtx.getImageData(0, 0, cellSize, cellSize);
    let hasContent = false;
    for (let p = 3; p < imgData.data.length; p += 4) {
      if (imgData.data[p] > 10) { hasContent = true; break; }
    }

    const dataUrl = cellCanvas.toDataURL();
    const cls = hasContent ? 'has-img' : 'transparent has-img';

    html += `<div class="${cls}" data-hex="0x${hexCode}" data-char="${ch}" data-row="${row}" data-col="${col}" data-w="${cellSize}" data-h="${cellSize}" data-img="${dataUrl}" style="background-image:url(${dataUrl})" title="U+${hexCode}"></div>`;
  }

  grid.innerHTML = html;
  document.getElementById('atlasInfo').textContent = `glyph_${hex}.png — ${img.width}×${img.height}px, ячейка ${cellSize}px`;
}

// Generate button
document.getElementById('btnGenerate').addEventListener('click', () => {
  const hex = document.getElementById('hexInput').value.trim().toUpperCase().replace(/[^0-9A-F]/g, '');
  if (hex) generateGrid(hex);
});

// Quick action buttons
document.querySelectorAll('[data-hex]').forEach(btn => {
  if (btn.tagName === 'BUTTON') {
    btn.addEventListener('click', () => {
      const hex = btn.dataset.hex;
      document.getElementById('hexInput').value = hex;
      generateGrid(hex);
    });
  }
});

// File upload
document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  // Try to extract hex from filename
  const match = file.name.match(/glyph_([0-9A-Fa-f]{1,4})/i);
  let hex = match ? match[1].toUpperCase() : document.getElementById('hexInput').value.trim().toUpperCase();
  if (!hex) hex = 'E0';

  document.getElementById('hexInput').value = hex;

  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = () => {
      processImage(img, hex);
      const status = document.getElementById('uploadStatus');
      status.textContent = `✓ ${file.name} загружен`;
      status.style.display = 'block';
      toast('Глиф-лист загружен!');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// Drag & drop
const uploadZone = document.getElementById('uploadZone');
['dragenter','dragover'].forEach(ev => {
  uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.style.borderColor = 'var(--accent)'; });
});
['dragleave','drop'].forEach(ev => {
  uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.style.borderColor = ''; });
});
uploadZone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) {
    const input = document.getElementById('fileInput');
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    input.dispatchEvent(new Event('change'));
  }
});

// Grid cell click → detail
document.getElementById('glyphGrid').addEventListener('click', e => {
  const cell = e.target.closest('[data-hex]');
  if (!cell) return;

  const hex = cell.dataset.hex || '';
  const ch = cell.dataset.char || '';
  const code = ch.codePointAt(0);
  const row = parseInt(cell.dataset.row);
  const col = parseInt(cell.dataset.col);
  const w = cell.dataset.w || '?';
  const h = cell.dataset.h || '?';
  const imgSrc = cell.dataset.img || '';
  const cleanHex = hex.replace('0x', '');

  document.getElementById('dHex').textContent = hex;
  document.getElementById('dDec').textContent = code;
  document.getElementById('dChar').textContent = ch;
  document.getElementById('dPos').textContent = `Ряд ${row}, Колонка ${col}`;
  document.getElementById('dPHP').textContent = `"\\u{${cleanHex}}"`;
  document.getElementById('dSize').textContent = `${w}×${h}px`;
  document.getElementById('dPHPStr').textContent = `"\\u{${cleanHex}}" // U+${cleanHex} (R${row}C${col})`;

  const detailImg = document.getElementById('detailImg');
  if (imgSrc) {
    detailImg.src = imgSrc;
  } else {
    // Create transparent placeholder
    const c = document.createElement('canvas');
    c.width = 16; c.height = 16;
    detailImg.src = c.toDataURL();
  }

  // Store current data for copy buttons
  detailImg.dataset.hex = cleanHex;
  detailImg.dataset.char = ch;
  detailImg.dataset.imgSrc = imgSrc;

  document.getElementById('overlay').classList.add('active');
});

// Close overlay on background click
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').classList.remove('active');
  }
});

// Swipe down to close
let touchStartY = 0;
document.getElementById('detailSheet').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
});
document.getElementById('detailSheet').addEventListener('touchmove', e => {
  const dy = e.touches[0].clientY - touchStartY;
  if (dy > 80) {
    document.getElementById('overlay').classList.remove('active');
  }
});

// Detail field copy
document.querySelectorAll('.detail-field').forEach(field => {
  field.addEventListener('click', () => {
    const value = field.querySelector('.value').textContent;
    if (value && value !== '-') {
      navigator.clipboard.writeText(value).then(() => toast());
    }
  });
});

// Copy buttons
document.getElementById('btnCopyChar').addEventListener('click', () => {
  const ch = document.getElementById('dChar').textContent;
  navigator.clipboard.writeText(ch).then(() => toast('Символ скопирован!'));
});
document.getElementById('btnCopyPHP').addEventListener('click', () => {
  const php = document.getElementById('dPHP').textContent;
  navigator.clipboard.writeText(php).then(() => toast('PHP код скопирован!'));
});
document.getElementById('btnDlCell').addEventListener('click', () => {
  const img = document.getElementById('detailImg');
  if (!img.dataset.imgSrc) return;
  const a = document.createElement('a');
  a.href = img.dataset.imgSrc;
  a.download = `glyph_${img.dataset.hex}.png`;
  a.click();
  toast('Скачивание...');
});

// Export atlas
document.getElementById('btnExport').addEventListener('click', () => {
  if (!atlasDataUrl) { toast('Сначала загрузите изображение!'); return; }
  const a = document.createElement('a');
  a.href = atlasDataUrl;
  a.download = `glyph_${currentHex}.png`;
  a.click();
  toast('Атлас скачан!');
});

// Converter
document.getElementById('convInput').addEventListener('input', function() {
  let input = this.value.trim();
  const output = document.getElementById('convOutput');
  if (!input) { output.value = ''; return; }

  // Remove prefixes
  let isHex = false;
  if (/^(0x|u\+|U\+|\\u\{)/i.test(input)) {
    isHex = true;
    input = input.replace(/^(0x|u\+|U\+|\\u\{|\})/gi, '');
  }

  if (isHex || (input.length > 1 && /^[0-9A-Fa-f]+$/.test(input))) {
    try {
      const code = parseInt(input, 16);
      const ch = String.fromCodePoint(code);
      output.value = ch;
    } catch { output.value = 'Ошибка'; }
  } else if ([...input].length === 1) {
    const code = input.codePointAt(0);
    output.value = `U+${code.toString(16).toUpperCase().padStart(4, '0')}`;
  } else {
    output.value = 'Невалидный ввод';
  }
});

document.getElementById('convOutput').addEventListener('click', function() {
  if (this.value) {
    navigator.clipboard.writeText(this.value).then(() => toast());
  }
});

// Init
generateGrid('E1');
</script>
</body>
</html>
